name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Copy assets for embedding
        run: |
          cp -r patches go/embed/patches
          cp -r contrib go/embed/contrib

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd go
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../unleash-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unleash-${{ matrix.suffix }}
          path: unleash-${{ matrix.suffix }}${{ matrix.ext || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum unleash-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/unleash-*
            artifacts/checksums.txt
          body: |
            ## Quick Start

            ```bash
            # Download for your platform
            curl -sSL https://github.com/VoidChecksum/unleash/releases/download/${{ github.ref_name }}/unleash-linux-amd64 -o unleash
            chmod +x unleash

            # One-shot setup
            ./unleash setup
            ```

            **Windows:** Download `unleash-windows-amd64.exe`, rename to `unleash.exe`.

            **macOS:** Download `unleash-darwin-arm64` (Apple Silicon) or `unleash-darwin-amd64` (Intel).

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare npm package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p npm-pkg/bin

          # Copy all binaries
          cp artifacts/unleash-linux-amd64 npm-pkg/bin/unleash-linux-x64
          cp artifacts/unleash-linux-arm64 npm-pkg/bin/unleash-linux-arm64
          cp artifacts/unleash-darwin-amd64 npm-pkg/bin/unleash-darwin-x64
          cp artifacts/unleash-darwin-arm64 npm-pkg/bin/unleash-darwin-arm64
          cp artifacts/unleash-windows-amd64.exe npm-pkg/bin/unleash-win32-x64.exe
          cp artifacts/unleash-windows-arm64.exe npm-pkg/bin/unleash-win32-arm64.exe
          chmod +x npm-pkg/bin/unleash-*

          # Generate package.json
          cat > npm-pkg/package.json << EOF
          {
            "name": "unleash-cc",
            "version": "$VERSION",
            "description": "Unleash Claude Code — 113 patches, zero refusals, zero telemetry, 42 feature gates unlocked",
            "license": "GPL-3.0-or-later",
            "repository": {
              "type": "git",
              "url": "https://github.com/VoidChecksum/unleash"
            },
            "homepage": "https://github.com/VoidChecksum/unleash",
            "author": "VoidChecksum",
            "keywords": [
              "claude-code", "binary-patching", "bun-sea",
              "reverse-engineering", "permission-bypass",
              "telemetry-removal", "feature-unlock"
            ],
            "bin": {
              "unleash": "bin/run.js"
            },
            "os": ["darwin", "linux", "win32"],
            "cpu": ["x64", "arm64"],
            "files": ["bin/"]
          }
          EOF

          # Generate bin/run.js launcher
          cat > npm-pkg/bin/run.js << 'RUNJS'
          #!/usr/bin/env node
          const { execFileSync } = require("child_process");
          const path = require("path");
          const os = require("os");

          const platform = os.platform();
          const arch = os.arch();

          let bin;
          if (platform === "win32") {
            bin = arch === "arm64" ? "unleash-win32-arm64.exe" : "unleash-win32-x64.exe";
          } else if (platform === "darwin") {
            bin = arch === "arm64" ? "unleash-darwin-arm64" : "unleash-darwin-x64";
          } else {
            bin = arch === "arm64" ? "unleash-linux-arm64" : "unleash-linux-x64";
          }

          const binPath = path.join(__dirname, bin);
          try {
            execFileSync(binPath, process.argv.slice(2), { stdio: "inherit" });
          } catch (e) {
            process.exit(e.status || 1);
          }
          RUNJS

      - name: Publish to npm
        working-directory: npm-pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
