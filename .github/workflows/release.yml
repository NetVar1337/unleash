name: Release

on:
  push:
    tags:
      - 'cc-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Copy assets for embedding
        run: |
          cp -r patches go/embed/patches
          cp -r contrib go/embed/contrib

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd go
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../unleash-${{ matrix.suffix }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unleash-${{ matrix.suffix }}
          path: unleash-${{ matrix.suffix }}${{ matrix.ext || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum unleash-* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/unleash-*
            artifacts/checksums.txt
          body: |
            ## Quick Start

            ```bash
            npm install -g unleash-cc@latest
            unleash setup
            ```

            **Windows:** Download `unleash-windows-amd64.exe`, rename to `unleash.exe`.

            **macOS:** Download `unleash-darwin-arm64` (Apple Silicon) or `unleash-darwin-amd64` (Intel).

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare npm package
        run: |
          VERSION="${GITHUB_REF_NAME#cc-v}"
          node scripts/package-npm.mjs \
            artifacts npm-pkg unleash-cc unleash unleash "$VERSION" \
            "Unleash Claude Code — 113 patches, zero refusals, zero telemetry, 42 feature gates unlocked" \
            "claude-code,binary-patching,bun-sea,reverse-engineering,permission-bypass,telemetry-removal,feature-unlock"

      - name: Publish to npm
        working-directory: npm-pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
