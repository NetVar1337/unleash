name: Upstream Watch

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Get CC version
        id: cc
        run: |
          CC_VER=$(claude --version 2>/dev/null | head -1 | grep -oP '[\d.]+' || echo "unknown")
          echo "version=$CC_VER" >> $GITHUB_OUTPUT
          CC_BIN=$(which claude 2>/dev/null || echo "")
          echo "binary=$CC_BIN" >> $GITHUB_OUTPUT
          if [ -n "$CC_BIN" ]; then
            CC_SHA=$(sha256sum "$CC_BIN" | cut -c1-12)
            echo "sha=$CC_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Copy assets and build unleash
        run: |
          cp -r patches go/embed/patches
          cp -r contrib go/embed/contrib
          cd go && go build -o ../unleash .

      - name: Scan for drift
        id: scan
        run: |
          ./unleash scan 2>&1 | tee scan-output.txt
          DRIFT=$(grep -c "DRIFT\|drift" scan-output.txt || true)
          echo "drift_count=$DRIFT" >> $GITHUB_OUTPUT

      - name: Auto-heal if drifted
        if: steps.scan.outputs.drift_count != '0'
        run: |
          ./unleash scan --auto-heal 2>&1 | tee heal-output.txt

          # Check if patches changed
          if git diff --quiet patches/; then
            echo "No patch changes after heal"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add patches/
            git commit -m "fix(patches): auto-heal for Claude Code ${{ steps.cc.outputs.version }}

          Binary SHA: ${{ steps.cc.outputs.sha }}
          Drift detected and healed by upstream-watch workflow.

          [automated]"
            git push
          fi

      - name: Report unfixable drift
        if: steps.scan.outputs.drift_count != '0'
        run: |
          # Re-scan after heal to check remaining drift
          REMAINING=$(./unleash scan 2>&1 | grep -c "DRIFT" || true)
          if [ "$REMAINING" -gt "0" ]; then
            gh issue create \
              --title "Signature drift: $REMAINING patches broken on CC ${{ steps.cc.outputs.version }}" \
              --label "signature-drift" \
              --body "## Upstream Watch drift report

          - **Claude Code version**: \`${{ steps.cc.outputs.version }}\`
          - **Binary SHA**: \`${{ steps.cc.outputs.sha }}\`
          - **Unfixed patches**: $REMAINING

          Auto-heal attempted but $REMAINING patches could not be recovered.
          Manual RE of the binary is needed to update \`search_regex\` + \`anchor_strings\`.

          <details>
          <summary>Scan output</summary>

          \`\`\`
          $(./unleash scan --verbose 2>&1)
          \`\`\`
          </details>

          *Generated by upstream-watch workflow*" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
