name: Release Unleash-OMP

on:
  push:
    tags:
      - 'omp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Build Unleash-OMP
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          cd go
          VERSION="${GITHUB_REF_NAME#omp-v}"
          go build -ldflags="-s -w -X main.version=$VERSION" \
            -o ../unleash-omp-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/unleash-omp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unleash-omp-${{ matrix.suffix }}
          path: unleash-omp-${{ matrix.suffix }}${{ matrix.ext || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum unleash-omp-* > checksums.txt
          cat checksums.txt

      - name: Create Unleash-OMP release
        uses: softprops/action-gh-release@v2
        with:
          name: Unleash-OMP ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/unleash-omp-*
            artifacts/checksums.txt
          body: |
            ## Quick Start

            ```bash
            npm install -g unleash-omp@latest
            unleash-omp setup
            ```

            **Windows:** Download `unleash-omp-windows-amd64.exe`, rename to `unleash-omp.exe`.

            **macOS:** Download `unleash-omp-darwin-arm64` (Apple Silicon) or `unleash-omp-darwin-amd64` (Intel).

            **Linux:** Download `unleash-omp-linux-amd64` or `unleash-omp-linux-arm64`.

  npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare Unleash-OMP npm package
        run: |
          VERSION="${GITHUB_REF_NAME#omp-v}"
          node scripts/package-npm.mjs \
            artifacts npm-pkg unleash-omp unleash-omp unleash-omp "$VERSION" \
            "Unleash-OMP for Oh-My-Pi — operator config and byte patcher" \
            "oh-my-pi,omp,binary-patching,go,telemetry-removal,operator-authorization"

      - name: Publish Unleash-OMP to npm
        working-directory: npm-pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
