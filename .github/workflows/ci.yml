name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Python unit tests — all OS × Python version combinations ──────────────
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Byte-compile all sources
        run: python -m compileall vpcc .github/scripts/upstream_check.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: python -m vpcc --help

  # ── PowerShell syntax validation (Windows-native parser) ─────────────────
  lint-ps1:
    name: PowerShell syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate all .ps1 files parse without errors
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter '*.ps1' |
                   Select-Object -ExpandProperty FullName
          $failed = $false
          foreach ($f in $files) {
            $tokens     = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $f, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              Write-Host "FAIL: $f"
              foreach ($e in $parseErrors) { Write-Host "  $e" }
              $failed = $true
            } else {
              Write-Host "OK:   $f"
            }
          }
          if ($failed) { exit 1 }

  # ── Windows install-script dry-run (no Claude Code required) ─────────────
  windows-install-dryrun:
    name: Windows install script dry-run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install vpcc
        run: python -m pip install -e .

      - name: Smoke-test vpcc commands that don't need a live binary
        shell: pwsh
        run: |
          python -m vpcc list
          python -m vpcc status
          python -m vpcc --help

  # ── Build check — wheel + sdist must build cleanly ───────────────────────
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --quiet build
          python -m build
          ls -lh dist/

      - name: Verify wheel installs and CLI is reachable
        run: |
          python -m pip install dist/*.whl
          vpcc --help
